resources:
  jobs:
    metric_views_labs:
      name: "[${bundle.target}] The Metric is Mine — Metric Views labs"
      max_concurrent_runs: 1
      tasks:
        - task_key: lab_01_build_sales_metric_view
          notebook_task:
            notebook_path: ../labs/metric-views/lab_01__build_a_governed_sales_metric_view.ipynb
            warehouse_id: ${var.warehouse_id}
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: lab_02_joins_and_fanout
          depends_on:
            - task_key: lab_01_build_sales_metric_view
          notebook_task:
            notebook_path: ../labs/metric-views/lab_02__joins_cardinality_and_fanout.ipynb
            warehouse_id: ${var.warehouse_id}
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: lab_03_windows_and_materialization
          depends_on:
            - task_key: lab_02_joins_and_fanout
          notebook_task:
            notebook_path: ../labs/metric-views/lab_03__windows_offsets_and_materialization.ipynb
            warehouse_id: ${var.warehouse_id}
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: lab_04_recent_features
          depends_on:
            - task_key: lab_03_windows_and_materialization
          notebook_task:
            notebook_path: ../labs/metric-views/lab_04__recent_features_filter_offset_relationships.ipynb
            warehouse_id: ${var.warehouse_id}
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
