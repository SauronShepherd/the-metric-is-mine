bundle:
  name: the_metric_is_mine

include:
  - metric-views-labs.yml

sync:
  include:
    - "*.ipynb"

variables:
  catalog:
    description: Unity Catalog catalog used by the labs.
    default: workspace
  schema:
    description: Writable schema used by the labs.
    default: metric_views_lab
  warehouse_id:
    description: Serverless or Pro SQL Warehouse used to execute SQL-only notebooks.

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: metric_views_lab
